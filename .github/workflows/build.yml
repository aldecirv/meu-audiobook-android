name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing keystore
        run: echo "${{ secrets.AURORA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/aurora.jks"

      - name: Build debug APK
        env:
          AURORA_KEYSTORE_PATH: ${{ runner.temp }}/aurora.jks
          AURORA_KEYSTORE_PASS: ${{ secrets.AURORA_KEYSTORE_PASS }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASS: ${{ secrets.AURORA_KEY_PASS }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-audiobook-debug
          path: app/build/outputs/apk/debug/*.apk
